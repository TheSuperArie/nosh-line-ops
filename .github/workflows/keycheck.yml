name: keycheck
on:
  repository_dispatch:
    types: [keycheck]
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.parse
          k = os.environ["YM_TOKEN"]
          s = k.strip()
          print("LEN", len(k), "STRIPPED", len(s), "DOTS", s.count("."), "HAS_APIK", "apik__" in s, "COLON", ":" in s, "STARTS_SYS", s.startswith("0772253471:"), "SPACES", " " in s)
          U = "https://www.call2all.co.il/ym/api/GetSession"
          tries = [("bearer", urllib.request.Request(U, headers={"Authorization": "Bearer " + s})),
                   ("x-api-key", urllib.request.Request(U, headers={"x-api-key": s})),
                   ("apiKey param", urllib.request.Request(U, data=urllib.parse.urlencode({"apiKey": s}).encode())),
                   ("get token", urllib.request.Request(U + "?token=" + urllib.parse.quote(s)))]
          for name, req in tries + [("param", urllib.request.Request("https://www.call2all.co.il/ym/api/GetSession", data=urllib.parse.urlencode({"token": s}).encode())),
                            ("header", urllib.request.Request("https://www.call2all.co.il/ym/api/GetSession", headers={"authorization": s}))]:
              try:
                  print("TRY", name, urllib.request.urlopen(req, timeout=30).read().decode()[:200])
              except Exception as e:
                  print("TRY", name, "ERR", e)
          PY
        env:
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
