name: inspect
on:
  repository_dispatch:
    types: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/linecmd.py
        env:
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
          INSPECT: ${{ github.event.client_payload.cmds }}
