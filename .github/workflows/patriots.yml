name: patriots
# הפטריוטים -> שלוחה 2/1/3 (אירוע patriots), וכל סדרה אחרת מיוטיוב (אירוע ytline, למשל רוזנבלום -> 8/2/1).
# מופעל מהשרת (shows_agent) כשעולה סרטון חדש. מאגר ציבורי = בלי עלות דקות.
on:
  repository_dispatch:
    types: [patriots, ytline]
  workflow_dispatch:
concurrency: ${{ github.event.action || 'manual' }}  # הפטריוטים בנפרד מסדרות אחרות (ytline)
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # מצב המתנה (watch) מחכה עד כמה שעות לפרק
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: |
          sudo apt-get -qq update > /dev/null || true  # בלי update ה-apt מבקש גרסאות שנמחקו מהשרת (404)
          sudo apt-get -qq install -y --fix-missing ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider edge-tts
          docker run -d --name bgutil -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider > /dev/null
          for i in $(seq 1 30); do curl -s localhost:4416/ping > /dev/null && break; sleep 1; done
          python3 tools/fix_cookies.py && cp cookies.txt /tmp/cookies.txt
          python3 tools/patriots.py
        env:
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          VID: ${{ github.event.client_payload.vid }}
          TEST: ${{ github.event.client_payload.test }}
          FOLDER: ${{ github.event.client_payload.folder }}
          KEEP: ${{ github.event.client_payload.keep }}
          DONE: ${{ github.event.client_payload.done }}
          CH: ${{ github.event.client_payload.ch }}
          MATCH: ${{ github.event.client_payload.match }}
          LABEL: ${{ github.event.client_payload.label }}
          INTRO: ${{ github.event.client_payload.intro }}
          PLF: ${{ github.event.client_payload.plf }}
          PL: ${{ github.event.client_payload.pl }}
          LAST: ${{ github.event.client_payload.last }}
          WATCH: ${{ github.event.client_payload.watch }}
          UNTIL: ${{ github.event.client_payload.until }}
