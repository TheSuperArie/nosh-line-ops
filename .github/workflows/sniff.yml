name: sniff
on:
  repository_dispatch:
    types: [sniff]
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
      - run: |
          python3 - <<'PY'
          import asyncio, json, os
          from playwright.async_api import async_playwright
          URL = os.environ["URL"]
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(locale="he-IL")
                  async def on_resp(r):
                      u = r.url
                      if any(x in u for x in ("api", "Api", ".mp3", "m3u8")) and not any(x in u for x in ("google", "nagich", "chatrace", "chatwoot")):
                          body = ""
                          try:
                              if "json" in (r.headers.get("content-type") or ""):
                                  body = (await r.text())[:700]
                          except Exception:
                              pass
                          print("REQ", r.request.method, r.status, u[:300], "|", body.replace("\n", " "))
                  pg.on("response", on_resp)
                  await pg.goto(URL, wait_until="networkidle", timeout=90000)
                  await pg.wait_for_timeout(8000)
                  txt = await pg.inner_text("body")
                  print("TEXT", txt[:1500].replace("\n", " | "))
                  await b.close()
          asyncio.run(main())
          PY
        env:
          URL: ${{ github.event.client_payload.url }}
