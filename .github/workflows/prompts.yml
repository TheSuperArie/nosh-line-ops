name: prompts
on:
  repository_dispatch:
    types: [prompts]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q edge-tts zmanim && (which ffmpeg || sudo apt-get install -y -q ffmpeg)
      - run: python3 tools/prompts.py
        env:
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
          ONLY: ${{ github.event.client_payload.only }}
