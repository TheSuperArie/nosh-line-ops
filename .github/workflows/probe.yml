name: probe
on:
  repository_dispatch:
    types: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ github.event.client_payload.url }}
        run: |
          for u in $URL; do echo "=== $u"; curl -sS -m 30 -A "Mozilla/5.0" "$u" | head -c 2500; echo; done
